<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ページを開く｜ケーキ屋さん こいまり 城東</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
/* LINEのリッチメニューから開いたときの「どこで開くか」の案内（2026-10-07オーナー指示）。
   LINEの中で開くとトーク画面と行き来しにくいため、いつものブラウザ／Chromeで開く選択肢を出す。
   LINE以外（PC・普通のブラウザ）から来たときは、この画面を出さずにそのまま目的のページへ移る。 */
:root{--bg:#f7f3ee;--paper:#fefcf8;--text:#2e2118;--soft:#6b5a48;--gold:#c9a96e;--gold-dark:#a88a52;--line:#e5d9c6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans JP",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:420px;background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:16px;padding:28px 22px 22px;text-align:center}
.mark{width:56px;height:56px;object-fit:contain}
h1{font-family:"Shippori Mincho",serif;font-size:21px;letter-spacing:.06em;margin:10px 0 8px;font-weight:700}
.lead{font-size:14.5px;line-height:1.8;color:var(--soft);margin:0 0 20px}
.opt{display:block;width:100%;text-decoration:none;border:1px solid var(--gold);border-radius:12px;padding:14px 16px;margin:0 0 10px;color:var(--text);background:#fff;text-align:left}
.opt b{display:block;font-size:16px;font-weight:700}
.opt small{display:block;font-size:12.5px;color:var(--soft);margin-top:2px}
.opt--main{background:var(--gold);border-color:var(--gold);color:#fff}
.opt--main small{color:#fff8ec}
.stay{display:inline-block;margin-top:8px;font-size:14px;color:var(--gold-dark);text-decoration:underline;text-underline-offset:3px}
.note{font-size:12px;color:var(--soft);line-height:1.7;margin:14px 0 0}
</style>
</head>
<body>
<main class="card" id="card" style="display:none;">
  <img class="mark" src="koimari-temari-mark.png" alt="">
  <h1>どの画面で開きますか？</h1>
  <p class="lead">ブラウザで開くと、LINEのトーク画面と行き来しながら、ページを見ていただけます。</p>
  <a class="opt opt--main" id="optDefault" href="#"><b>いつものブラウザで開く</b><small id="optDefaultSub">Safari など、お使いのブラウザ</small></a>
  <a class="opt" id="optChrome" href="#"><b>Google Chromeで開く</b><small>Chromeが入っているスマートフォンのみ</small></a>
  <a class="stay" id="optStay" href="#">このままLINEの中で見る</a>
  <p class="note">Yahoo!やEdgeなどをお使いの方は、「いつものブラウザ」に設定していれば、そのブラウザで開きます。</p>
</main>
<script>
(function () {
  var BASE = "https://koimari-official.github.io/koimari-site/";
  var to = new URLSearchParams(location.search).get("to") || "index.html";
  // このサイトのページだけを開く（外部サイトへ飛ばされないように）
  if (!/^[a-z0-9_\-]+\.html(\?[^#]*)?(#[a-z0-9_\-]*)?$/i.test(to)) to = "index.html";
  var target = BASE + to;
  var ua = navigator.userAgent || "";
  var inLine = / Line\//i.test(ua) || /\bLine\//.test(ua);
  if (!inLine) { location.replace(target); return; }
  var isAndroid = /Android/i.test(ua), isIOS = /iPhone|iPad|iPod/i.test(ua);
  // いつものブラウザ：LINEの「openExternalBrowser=1」で、端末の既定のブラウザで開く
  var hashAt = target.indexOf("#");
  var noHash = hashAt >= 0 ? target.slice(0, hashAt) : target, hash = hashAt >= 0 ? target.slice(hashAt) : "";
  document.getElementById("optDefault").href = noHash + (noHash.indexOf("?") >= 0 ? "&" : "?") + "openExternalBrowser=1" + hash;
  document.getElementById("optDefaultSub").textContent = isAndroid ? "Chrome など、お使いのブラウザ" : "Safari など、お使いのブラウザ";
  var chrome = document.getElementById("optChrome");
  if (isIOS) chrome.href = target.replace(/^https:\/\//, "googlechromes://");
  else if (isAndroid) chrome.href = "intent://" + noHash.replace(/^https:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(target) + ";end";
  else chrome.style.display = "none";
  document.getElementById("optStay").href = target;
  document.getElementById("card").style.display = "";
})();
</script>
</body>
</html>
