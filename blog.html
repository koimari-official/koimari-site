<style>
:root{
  --color-bg: #f7f3ee;--color-bg-soft: #ede3d4;--color-paper:#fefcf8;
  --color-text:#2e2118;--color-text-soft: #4a3a2a;
  --color-accent: #c9a96e;--color-accent-dark: #a88a52;
  --color-gold: #c9a96e;--color-gold-light: #ddc190;
  --color-line: #d8baa4;--color-info:#4a6f9c;
  --font-mincho:"Shippori Mincho",serif;
  --font-sans:"Noto Sans JP",sans-serif;
  --font-en:"Cormorant Garamond",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);color:var(--color-text);background:var(--color-bg);line-height:1.95;font-size:21px;font-weight:600;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}

/* ── Header ── */
.header{position:sticky;top:0;z-index:100;overflow:hidden;background:linear-gradient(135deg,#5c4a38 0%,#4a3a2a 100%)}

.header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--color-gold),transparent)}
.header__inner{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:22px 24px;display:flex;align-items:center;justify-content:space-between}
.header__logo{display:flex;align-items:center;gap:10px;line-height:1}
.header__logo-mark{width:82px;height:82px;object-fit:contain}
.header__logo-text{display:flex;flex-direction:column;line-height:1}
.header__logo-en{font-family:var(--font-en);font-size:40px;font-style:normal;letter-spacing:.2em;color:var(--color-accent);font-weight:700}
.header__logo-jp{font-family:var(--font-mincho);font-size:18px;letter-spacing:.08em;color:#fff;font-weight:600;margin-top:8px;white-space:nowrap}
.back-link{font-family:var(--font-mincho);font-size:18px;color:#e8dcc8;letter-spacing:.08em;font-weight:500;background:none;border:none;cursor:pointer;transition:color .2s;padding:0}
.back-link:hover{color:var(--color-accent)}
.nav-link{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;font-family:var(--font-mincho);font-size:14px;letter-spacing:.06em;color:var(--color-text-soft);font-weight:600;position:relative;transition:color .22s;white-space:nowrap}
.nav-link::after{content:'';position:absolute;left:16px;right:16px;bottom:2px;height:1px;background:var(--color-gold);transform:scaleX(0);transform-origin:center;transition:transform .25s ease}
.nav-link:hover{color:var(--color-accent)}
.nav-link:hover::after{transform:scaleX(1)}
.sub-nav{background:var(--color-bg-soft);border-bottom:1px solid var(--color-line)}
.sub-nav ul{max-width:1180px;margin:0 auto;display:flex;justify-content:center;flex-wrap:wrap;align-items:center;gap:2px;list-style:none;padding:10px 8px}

/* ── Page header ── */
.page-head{position:relative;text-align:center;padding:50px 24px 44px;background:linear-gradient(180deg,var(--color-bg-soft) 0%,#ede0cc 100%);overflow:hidden}
.page-head::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(60deg,transparent 0 38px,rgba(184,153,104,.05) 38px 39px),repeating-linear-gradient(-60deg,transparent 0 38px,rgba(184,153,104,.05) 38px 39px);pointer-events:none}
.page-head__deco{position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);font-family:var(--font-en);font-style:italic;font-size:clamp(100px,18vw,180px);color:var(--color-gold);opacity:.055;font-weight:600;letter-spacing:-.02em;pointer-events:none;white-space:nowrap;line-height:1}
.page-head__inner{position:relative;z-index:1}
.page-head__en{font-family:var(--font-en);font-style:italic;color:var(--color-accent);letter-spacing:.36em;font-size:21px;display:inline-block;margin-bottom:16px;font-weight:500}
.page-head__title{font-family:var(--font-mincho);font-size:clamp(28px,4vw,40px);letter-spacing:.22em;font-weight:600;display:inline-block;padding-bottom:24px;margin-bottom:24px;position:relative}
.page-head__title::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:48px;height:1px;background:linear-gradient(90deg,transparent,var(--color-gold),transparent)}
.page-head__lead{color:var(--color-text-soft);font-size:15px;font-family:var(--font-mincho);letter-spacing:.06em;line-height:2.1}

/* ── Category pills ── */
.cat-tabs{background:var(--color-bg);padding:24px 24px 0;border-bottom:1px solid var(--color-line)}
.cat-tabs__inner{max-width:1100px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;padding-bottom:24px}
.cat-tab{font-family:var(--font-mincho);font-size:14px;letter-spacing:.1em;padding:9px 22px;border-radius:32px;border:1.5px solid var(--color-line);color:var(--color-text-soft);cursor:pointer;background:none;white-space:nowrap;transition:all .22s;font-weight:500}
.cat-tab.active{background:var(--color-accent);color:#fff;border-color:var(--color-accent)}
.cat-tab:hover:not(.active){border-color:var(--color-text-soft);color:var(--color-text)}

/* ── Main ── */
main{max-width:1100px;margin:0 auto;padding:72px 24px 110px}

/* ── Featured (cinematic) ── */
.featured{margin-bottom:72px}
.featured-card{position:relative;overflow:hidden;cursor:pointer;aspect-ratio:2/1;background:var(--color-bg-soft)}
.featured-card__bg{position:absolute;inset:0}
.featured-card__bg img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.16,1,.3,1)}
.featured-card:hover .featured-card__bg img{transform:scale(1.06)}
.featured-card__overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(14,7,3,.9) 0%,rgba(14,7,3,.5) 40%,rgba(0,0,0,.05) 100%)}
.featured-card__body{position:absolute;bottom:0;left:0;right:0;padding:clamp(28px,4vw,52px) clamp(28px,5vw,58px)}
.featured-card__meta{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.featured-card__label{font-family:var(--font-en);font-size:11px;letter-spacing:.34em;color:var(--color-gold-light);font-weight:600;text-transform:uppercase}
.featured-card__cat{display:inline-block;padding:4px 13px;font-family:var(--font-mincho);font-size:11px;letter-spacing:.14em;font-weight:600;border:1px solid rgba(255,255,255,.4);color:#fff;background:rgba(255,255,255,.1);backdrop-filter:blur(6px)}
.featured-card__date{font-family:var(--font-sans);font-size:14px;color:rgba(255,255,255,.85);letter-spacing:.02em;font-weight:600}
.featured-card__read{font-family:var(--font-mincho);font-size:11px;color:rgba(255,255,255,.55)}
.featured-card__title{font-family:var(--font-mincho);font-size:clamp(22px,3vw,36px);letter-spacing:.1em;line-height:1.5;font-weight:600;margin-bottom:14px;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.35)}
.featured-card__excerpt{font-size:14px;color:rgba(255,255,255,.78);line-height:1.9;max-width:580px;margin-bottom:28px}
.featured-card__more{display:inline-flex;align-items:center;gap:12px;font-family:var(--font-mincho);font-size:13px;letter-spacing:.16em;font-weight:500;color:#fff;padding:11px 28px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);backdrop-filter:blur(6px);transition:background .25s,gap .22s}
.featured-card:hover .featured-card__more{background:rgba(255,255,255,.2);gap:17px}
/* no-image fallback */
.featured-card--text{background:linear-gradient(135deg,var(--color-bg-soft) 0%,#e4d0b8 100%)}
.featured-card--text .featured-card__overlay{background:linear-gradient(to top,rgba(46,33,24,.18) 0%,transparent 100%)}
.featured-card--text .featured-card__title{color:var(--color-text);text-shadow:none}
.featured-card--text .featured-card__cat{color:var(--color-accent);border-color:rgba(201,169,110,.4);background:rgba(201,169,110,.08)}
.featured-card--text .featured-card__date{color:var(--color-text-soft)}
.featured-card--text .featured-card__excerpt{color:var(--color-text-soft)}
.featured-card--text .featured-card__more{color:var(--color-accent);border-color:rgba(201,169,110,.4);background:transparent}
.featured-card--text .featured-card__label{color:var(--color-gold)}

/* ── Ornament divider ── */
.ornament-div{display:flex;align-items:center;gap:20px;margin:0 0 44px}
.ornament-div__line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--color-gold),transparent);opacity:.6}
.ornament-div__mark{font-family:var(--font-en);font-size:13px;color:var(--color-gold);opacity:.7;letter-spacing:.06em}
.ornament-div__text{font-family:var(--font-mincho);font-size:13px;color:var(--color-text-soft);letter-spacing:.18em;white-space:nowrap}

/* ── Blog grid ── */
.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}

/* scroll-reveal: applied via JS so cards are visible when JS off */
.fade-reveal{opacity:0;transform:translateY(30px);transition:opacity .7s ease,transform .7s cubic-bezier(.16,1,.3,1)}
.fade-reveal.visible{opacity:1;transform:translateY(0)}

.blog-card{background:var(--color-paper);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:0 3px 18px rgba(58,42,35,.08),0 1px 4px rgba(58,42,35,.05);transition:transform .4s cubic-bezier(.16,1,.3,1),box-shadow .4s ease}
.blog-card:hover{transform:translateY(-7px);box-shadow:0 22px 52px rgba(58,42,35,.17),0 6px 16px rgba(58,42,35,.08)}

.blog-card__img{aspect-ratio:3/2;overflow:hidden;position:relative;background:var(--color-bg-soft)}
.blog-card__img img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.16,1,.3,1)}
.blog-card:hover .blog-card__img img{transform:scale(1.09)}
/* warm amber overlay */
.blog-card__img::after{content:"";position:absolute;inset:0;background:rgba(184,112,48,.15);opacity:0;transition:opacity .45s;pointer-events:none}
.blog-card:hover .blog-card__img::after{opacity:1}
/* category badge on image */
.blog-card__cat-img{position:absolute;bottom:12px;left:12px;z-index:1;display:inline-block;padding:4px 12px;font-family:var(--font-mincho);font-size:10px;letter-spacing:.16em;font-weight:600;backdrop-filter:blur(8px)}
.cat-color-cake{background:rgba(255,251,249,.88);color:var(--color-accent)}
.cat-color-diary{background:rgba(255,251,245,.88);color:#8a6a2e}
.cat-color-news{background:rgba(247,250,255,.88);color:var(--color-info)}
.cat-color-other{background:rgba(250,248,244,.88);color:var(--color-text-soft)}
/* NEW badge */
.blog-card__new{position:absolute;top:12px;right:12px;z-index:2;background:var(--color-accent);color:#fff;font-family:var(--font-en);font-size:10px;letter-spacing:.2em;padding:4px 10px;font-weight:600}
/* no-image placeholder */
.blog-card__img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--color-bg-soft) 0%,#e4d0b8 100%)}
.blog-card__img-placeholder-text{font-family:var(--font-en);font-style:italic;font-size:32px;color:var(--color-gold);opacity:.35;font-weight:600}

.blog-card__body{padding:24px 26px 28px;flex:1;display:flex;flex-direction:column}
.blog-card__top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:8px}
.blog-card__date{font-family:var(--font-sans);font-size:14px;color:var(--color-gold);letter-spacing:.02em;font-weight:600}
.blog-card__read{font-family:var(--font-mincho);font-size:11px;color:var(--color-text-soft);white-space:nowrap}
.blog-card__title{font-family:var(--font-mincho);font-size:18px;letter-spacing:.06em;line-height:1.7;margin-bottom:10px;font-weight:600;flex:1;color:var(--color-text)}
.blog-card__excerpt{font-size:13px;color:var(--color-text-soft);line-height:1.95;margin-bottom:20px}
.blog-card__footer{display:flex;align-items:center;padding-top:14px;border-top:1px solid var(--color-line);margin-top:auto}
.blog-card__more{font-family:var(--font-mincho);font-size:13px;color:var(--color-accent);letter-spacing:.1em;font-weight:500;flex:1;transition:letter-spacing .25s}
.blog-card:hover .blog-card__more{letter-spacing:.16em}
.blog-card__arrow{font-family:var(--font-en);font-size:18px;color:var(--color-gold);transition:transform .28s,color .28s}
.blog-card:hover .blog-card__arrow{transform:translateX(6px);color:var(--color-accent)}

/* empty */
.empty{background:var(--color-paper);padding:80px 20px;text-align:center;color:var(--color-text-soft);box-shadow:0 3px 18px rgba(58,42,35,.07);grid-column:1/-1}
.empty__icon{font-family:var(--font-en);font-style:italic;font-size:40px;color:var(--color-gold);opacity:.4;margin-bottom:16px;display:block}
.empty__text{font-family:var(--font-mincho);font-size:16px;letter-spacing:.12em}

/* ── Reading progress ── */
.progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--color-accent),var(--color-gold));width:0%;z-index:200;pointer-events:none;transition:width .12s linear}

/* ── Detail ── */
.detail{display:none;max-width:800px;margin:0 auto}
.detail.show{display:block}
.detail__back{margin-bottom:40px}
.detail__header{margin-bottom:44px}
.detail__cat{display:inline-block;padding:5px 16px;font-family:var(--font-mincho);font-size:12px;letter-spacing:.16em;font-weight:600;margin-bottom:20px}
.detail__meta{display:flex;align-items:center;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.detail__date{font-family:var(--font-sans);font-size:16px;color:var(--color-gold);letter-spacing:.02em;font-weight:600}
.detail__read{font-family:var(--font-mincho);font-size:13px;color:var(--color-text-soft)}
.detail__title{font-family:var(--font-mincho);font-size:clamp(26px,3.6vw,36px);letter-spacing:.08em;line-height:1.5;font-weight:600}
.detail__img{margin-bottom:48px;overflow:hidden;background:var(--color-bg-soft)}
.detail__img img{width:100%;display:block;max-height:540px;object-fit:cover}
.detail__body{font-size:20px;font-weight:600;line-height:2.15;color:var(--color-text);background:var(--color-paper);padding:52px clamp(26px,6vw,64px);box-shadow:0 4px 24px rgba(58,42,35,.07)}
.detail__body p{margin-bottom:28px}
.detail__body p:last-child{margin-bottom:0}
/* drop cap */
.detail__body > p:first-child::first-letter{font-family:var(--font-mincho);font-size:4.2em;float:left;line-height:.78;margin:.06em .12em -.02em 0;color:var(--color-accent);font-weight:600}
.detail__body h3{font-family:var(--font-mincho);font-size:21px;letter-spacing:.08em;margin:44px 0 18px;font-weight:600;padding-left:18px;border-left:3px solid var(--color-accent);line-height:1.5}
.detail__body h4{font-family:var(--font-mincho);font-size:18px;margin:32px 0 14px;font-weight:600;color:var(--color-text-soft)}
.detail__ornament{height:1px;background:linear-gradient(90deg,transparent,var(--color-gold),transparent);margin:44px 0;opacity:.5}
.detail__nav{display:flex;justify-content:space-between;margin-top:46px;padding-top:32px;border-top:1px solid var(--color-line);gap:16px;flex-wrap:wrap}
.detail__nav-item{max-width:46%}
.detail__nav-label{font-family:var(--font-en);font-style:italic;font-size:12px;color:var(--color-gold);letter-spacing:.1em;display:block;margin-bottom:6px}
.detail__nav a{font-family:var(--font-mincho);font-size:14px;color:var(--color-text-soft);letter-spacing:.06em;cursor:pointer;transition:color .2s;line-height:1.7;display:block}
.detail__nav a:hover{color:var(--color-accent)}
.detail__nav a.disabled{color:var(--color-line);cursor:default;pointer-events:none}
.detail__share{margin-top:44px;padding:32px 36px;background:var(--color-bg-soft);text-align:center;display:none}
.detail__share-title{font-family:var(--font-mincho);font-size:14px;letter-spacing:.14em;color:var(--color-text-soft);margin-bottom:18px;font-weight:500}
.detail__share-links{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.share-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 26px;font-family:var(--font-mincho);font-size:13px;letter-spacing:.1em;font-weight:500;color:#fff;transition:opacity .2s}
.share-btn:hover{opacity:.84}
.share-btn--tw{background:#1da1f2}
.share-btn--line{background:#06c755}

/* ── Footer ── */
.footer{background:#2b1f1a;color:#e3d5c2;padding:44px 24px;text-align:center;font-family:var(--font-en);font-size:14px;letter-spacing:.18em}
.footer__mark{font-family:var(--font-mincho);font-size:13px;letter-spacing:.4em;color:#b09a82;margin-bottom:10px}

/* ── Responsive ── */
@media(max-width:960px){
  .blog-grid{grid-template-columns:repeat(2,1fr);gap:22px}
  .featured-card{aspect-ratio:16/9}
}
@media(max-width:700px){
  body{font-size:18px}
  .header__inner{flex-wrap:wrap;row-gap:12px}
  .header__logo-mark{width:56px;height:56px}
  .header__logo-en{font-size:26px}
  .header__logo-jp{font-size:15px}
  .back-link{font-size:16px}
  .page-head{padding:44px 22px 40px}
  .cat-tabs{padding:20px 20px 0}
  .cat-tabs__inner{padding-bottom:20px;gap:8px}
  .cat-tab{padding:8px 18px;font-size:13px}
  main{padding:52px 16px 88px}
  .featured{margin-bottom:48px}
  .featured-card{aspect-ratio:4/3}
  .blog-grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .blog-card__body{padding:14px 12px 16px}
  .blog-card__title{font-size:15px}
  .blog-card__excerpt{font-size:13px;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
  .detail__body{padding:32px 20px;font-size:16px}
  .detail__body > p:first-child::first-letter{font-size:3.5em}
  .detail__share{padding:24px 20px}
}
</style>

<div class="page-head">
  <div class="page-head__deco">Blog</div>
  <div class="page-head__inner">
    <span class="page-head__en">Blog &amp; Diary</span>
    <h1 class="page-head__title">ブログ・スタッフ日記</h1>
    <p class="page-head__lead">
      お菓子作りのこだわり、季節のおすすめ、日々の出来事を綴ります。<br>
      ふらりとお店を覗いていただくような気持ちでお読みください。
    </p>

</div>

<div class="cat-tabs" id="catTabsBar">
  <div class="cat-tabs__inner" id="catTabsInner"></div>
</div>

<main>
  <div id="listView">
    <div id="featuredWrap" class="featured"></div>
    <div class="ornament-div" id="ornamentDiv" style="display:none">
      <span class="ornament-div__line"></span>
      <span class="ornament-div__mark">✦</span>
      <span class="ornament-div__text">最近の記事</span>
      <span class="ornament-div__mark">✦</span>

    </div>

  </div>

    <div class="detail__back"><button class="back-link" id="backToList">← 記事一覧に戻る</button></div>

    <div class="detail__share" id="detailShare">
      <div class="detail__share-title">この記事をシェアする</div>
      <div class="detail__share-links" id="shareLinks"></div>
    </div>
  </article>
</main>

<footer class="footer">
  <div class="footer__mark">こ い ま り</div>

</footer>

<script>
const CATEGORIES = ['すべて','お菓子のこと','スタッフ日記','お知らせ'];
const CAT_CLASS = {'お菓子のこと':'cat-color-cake','スタッフ日記':'cat-color-diary','お知らせ':'cat-color-news'};

const DEFAULT_BLOG = [
  {id:"b1",category:"お菓子のこと",title:"春の苺、今年も最高の出来です",excerpt:"地元の農家さんから届く朝採れ苺。今年は寒暖差のおかげで甘みがしっかり乗っていて、例年以上に美味しい仕上がりです。",img:"https://images.unsplash.com/photo-1488477181946-6428a0291777?w=900&q=80",date:"2026.04.20",body:"地元の農家さんから届く朝採れ苺。今年は寒暖差のおかげで甘みがしっかりと乗っていて、例年以上に美味しい仕上がりです。\n\nショートケーキやタルトに使うのはもちろん、シーズン限定で苺づくしのプレートもご用意する予定です。お店にお越しの際はぜひお試しください。\n\n苺の季節は短いので、毎年このタイミングを楽しみにしています。来年もきっと同じ農家さんにお願いする予定です。"},
  {id:"b2",category:"スタッフ日記",title:"ケーキ屋さんになるまでの話",excerpt:"こいまりを開店するまでの道のりを、少しだけお話しさせてください。私が初めてお菓子作りに興味を持ったのは、子どもの頃に祖母と一緒に作ったクッキーがきっかけでした。",img:"https://images.unsplash.com/photo-1486427944299-d1955d23e34d?w=900&q=80",date:"2026.04.10",body:"こいまりを開店するまでの道のりを、少しだけお話しさせてください。\n\n私が初めてお菓子作りに興味を持ったのは、子どもの頃に祖母と一緒に作ったクッキーがきっかけでした。あの時の温かい記憶が、今もお菓子作りの原点になっています。\n\n専門学校で学び、いくつかのお店で修業させていただいた後、ようやく自分のお店を持つことができました。これからもこの場所で、皆様の大切なひとときに寄り添うお菓子をお作りしていきます。"},
  {id:"b3",category:"お知らせ",title:"母の日ケーキのご予約を承っております",excerpt:"今年も母の日のデコレーションケーキを限定でご用意いたします。お花のような絞りで彩った特別仕様のケーキを、4号・5号サイズでお作りします。",img:"https://images.unsplash.com/photo-1557925923-cd4648e211a0?w=900&q=80",date:"2026.04.05",body:"今年も母の日のデコレーションケーキを限定でご用意いたします。\n\nお花のような絞りで彩った特別仕様のケーキを、4号・5号サイズでお作りします。\n\nご予約は5月8日(金)までにお願いいたします。お引き渡し日は5月10日(土)・11日(日)です。\n\n大切なお母様への感謝の気持ちを、ぜひこいまりのケーキに込めてお届けください。"}
];

function loadBlog(){
  try{const r=localStorage.getItem('koimari_blog');if(r)return JSON.parse(r);}catch(e){}
  return DEFAULT_BLOG;
}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function nl2p(s){return esc(String(s||'').replace(/<\s*br\s*\/?\s*>/gi,'\n')).split(/\n+/).filter(Boolean).map(p=>`<p>${p}</p>`).join('');}
function readMin(s){return Math.max(1,Math.ceil((s||'').length/400));}
function catCls(c){return CAT_CLASS[c]||'cat-color-other';}
function isNew(dateStr){
  if(!dateStr) return false;
  const p=dateStr.split('.');
  if(p.length<3) return false;
  const d=new Date(+p[0],+p[1]-1,+p[2]);
  return (Date.now()-d)<30*864e5;
}

let allPosts = loadBlog();
let currentFilter = 'すべて';

// IntersectionObserver for scroll reveal
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add('visible');
      io.unobserve(e.target);
    }
  });
},{threshold:0.08});

// カテゴリタブ生成
const tabsInner = document.getElementById('catTabsInner');
CATEGORIES.forEach(cat=>{
  const btn = document.createElement('button');
  btn.className = 'cat-tab'+(cat==='すべて'?' active':'');
  btn.textContent = cat;
  btn.addEventListener('click',()=>{
    currentFilter = cat;
    document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    renderList();
  });
  tabsInner.appendChild(btn);
});

function filteredPosts(){
  return currentFilter==='すべて' ? allPosts : allPosts.filter(p=>p.category===currentFilter);
}

function renderList(){
  const posts = filteredPosts();
  const featuredWrap = document.getElementById('featuredWrap');
  const grid = document.getElementById('blogGrid');
  const ornament = document.getElementById('ornamentDiv');
  featuredWrap.innerHTML = '';
  grid.innerHTML = '';

  if(!posts.length){
    ornament.style.display='none';
    grid.innerHTML='<div class="empty"><span class="empty__icon">✿</span><div class="empty__text">該当する記事がありません</div></div>';
    return;
  }

  // ── 特集記事（先頭1件、シネマスタイル）
  const top = posts[0];
  const rt0 = readMin(top.body||top.excerpt);
  const hasImg = !!top.img;
  const fCard = document.createElement('div');
  fCard.className = 'featured-card' + (hasImg?'':' featured-card--text');
  fCard.innerHTML = `
    ${hasImg?`<div class="featured-card__bg"><img src="${esc(top.img)}" alt="${esc(top.title)}" loading="lazy"></div>`:''}
    <div class="featured-card__overlay"></div>
    <div class="featured-card__body">
      <div class="featured-card__meta">
        <span class="featured-card__label">Featured Story</span>
        <span class="featured-card__cat">${esc(top.category||'記事')}</span>
        <span class="featured-card__date">${esc(top.date||'')}</span>
        <span class="featured-card__read">約${rt0}分</span>
      </div>
      <div class="featured-card__title">${esc(top.title)}</div>
      <p class="featured-card__excerpt">${esc(String(top.excerpt||'').replace(/<\s*br\s*\/?\s*>/gi,'\n')).replace(/\n/g,'<br>')}</p>
      <span class="featured-card__more">続きを読む →</span>
    </div>`;
  fCard.addEventListener('click',()=>showDetail(top.id));
  featuredWrap.appendChild(fCard);

  // ── グリッド（残り）
  const rest = posts.slice(1);
  ornament.style.display = rest.length ? 'flex' : 'none';

  rest.forEach((p,idx)=>{
    const rt = readMin(p.body||p.excerpt);
    const card = document.createElement('article');
    card.className = 'blog-card';
    const imgHtml = p.img
      ? `<img src="${esc(p.img)}" alt="${esc(p.title)}" loading="lazy">`
      : `<div class="blog-card__img-placeholder"><span class="blog-card__img-placeholder-text">K</span></div>`;
    card.innerHTML = `
      <div class="blog-card__img">
        ${imgHtml}
        <span class="blog-card__cat-img ${catCls(p.category)}">${esc(p.category||'記事')}</span>
        ${isNew(p.date)?'<span class="blog-card__new">NEW</span>':''}
      </div>
      <div class="blog-card__body">
        <div class="blog-card__top">
          <span class="blog-card__date">${esc(p.date||'')}</span>
          <span class="blog-card__read">約${rt}分</span>
        </div>
        <h3 class="blog-card__title">${esc(p.title)}</h3>
        <p class="blog-card__excerpt">${esc(String(p.excerpt||'').replace(/<\s*br\s*\/?\s*>/gi,'\n')).replace(/\n/g,'<br>')}</p>
        <div class="blog-card__footer">
          <span class="blog-card__more">続きを読む</span>
          <span class="blog-card__arrow">→</span>
        </div>
      </div>`;
    card.addEventListener('click',()=>showDetail(p.id));
    // staggered reveal
    card.classList.add('fade-reveal');
    card.style.transitionDelay = (idx * 80) + 'ms';
    grid.appendChild(card);
    io.observe(card);
  });
}

function showDetail(id){
  const p = allPosts.find(x=>x.id===id);
  if(!p) return;
  const rt = readMin(p.body||p.excerpt);
  const idx = allPosts.findIndex(x=>x.id===id);
  const prev = idx>0 ? allPosts[idx-1] : null;
  const next = idx<allPosts.length-1 ? allPosts[idx+1] : null;

  document.getElementById('detailBody').innerHTML = `
    <div class="detail__header">
      <span class="detail__cat ${catCls(p.category)}">${esc(p.category||'記事')}</span>
      <div class="detail__meta">
        <span class="detail__date">${esc(p.date||'')}</span>
        <span class="detail__read">読了目安 約${rt}分</span>
      </div>
      <h1 class="detail__title">${esc(p.title)}</h1>
    </div>
    ${p.img?`<div class="detail__img"><img src="${esc(p.img)}" alt="${esc(p.title)}"></div>`:''}
    <div class="detail__body">${nl2p(p.body||'')}</div>
    <div class="detail__nav">
      <div class="detail__nav-item">
        <span class="detail__nav-label">← Prev</span>
        <a id="prevLink" class="${prev?'':'disabled'}">${prev?esc(prev.title):'—'}</a>
      </div>
      <div class="detail__nav-item" style="text-align:right">
        <span class="detail__nav-label">Next →</span>
        <a id="nextLink" class="${next?'':'disabled'}">${next?esc(next.title):'—'}</a>
      </div>
    </div>`;

  if(prev) document.getElementById('prevLink').addEventListener('click',()=>showDetail(prev.id));
  if(next) document.getElementById('nextLink').addEventListener('click',()=>showDetail(next.id));

  const pageUrl = encodeURIComponent(location.origin+location.pathname+'?id='+encodeURIComponent(id));
  const titleEnc = encodeURIComponent(p.title+' | こいまり');
  document.getElementById('shareLinks').innerHTML =
    `<a href="https://twitter.com/intent/tweet?url=${pageUrl}&text=${titleEnc}" target="_blank" rel="noopener" class="share-btn share-btn--tw">X / Twitter</a>
     <a href="https://line.me/R/msg/text/?${titleEnc}%0A${pageUrl}" target="_blank" rel="noopener" class="share-btn share-btn--line">LINE</a>`;
  document.getElementById('detailShare').style.display='block';

  document.getElementById('listView').style.display='none';
  document.getElementById('catTabsBar').style.display='none';
  document.getElementById('detailView').classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
  history.replaceState(null,'','?id='+encodeURIComponent(id));
}

document.getElementById('backToList').addEventListener('click',()=>{
  document.getElementById('listView').style.display='block';
  document.getElementById('catTabsBar').style.display='block';
  document.getElementById('detailView').classList.remove('show');
  document.getElementById('detailShare').style.display='none';
  history.replaceState(null,'',location.pathname);
  window.scrollTo({top:0,behavior:'smooth'});
});

// 読書進捗バー
window.addEventListener('scroll',()=>{
  const bar = document.getElementById('progressBar');
  if(!document.getElementById('detailView').classList.contains('show')){bar.style.width='0';return;}
  const total = document.body.scrollHeight-window.innerHeight;
  bar.style.width = total>0 ? Math.min(100,(window.scrollY/total)*100)+'%' : '100%';
});

renderList();

const initId = new URLSearchParams(location.search).get('id');
if(initId) showDetail(initId);

// Firebase側の最新記事データを反映する（以前はlocalStorageのみで、管理者本人の端末にしか反映されなかったための対応）
function applyFetchedBlogContent(data){
  if (!data || data.blog === undefined) return;
  try { localStorage.setItem('koimari_blog', JSON.stringify(data.blog)); } catch(e){}
  allPosts = data.blog;
  if (!document.getElementById('detailView').classList.contains('show')) renderList();
}
window.applyFetchedBlogContent = applyFetchedBlogContent;
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBMnJaIuF2vohO0YqKVmbcWeMBt9ZmSACI",
  authDomain: "koimari-tasting.firebaseapp.com",
  databaseURL: "https://koimari-tasting-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "koimari-tasting",
  storageBucket: "koimari-tasting.firebasestorage.app",
  messagingSenderId: "852851855633",
  appId: "1:852851855633:web:1bb5765680a137f20abcb0"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

onValue(ref(db, "koimariContent"), (snapshot) => {
  const data = snapshot.val();
  if (data && typeof window.applyFetchedBlogContent === "function") window.applyFetchedBlogContent(data);
});
</script>
