(function () {
  const DB = "https://koimari-tasting-default-rtdb.asia-southeast1.firebasedatabase.app";
  const q = new URLSearchParams(location.search), id = q.get("id") || "", idx = Number(q.get("i"));
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  const box = document.getElementById("nw");
  function render(n, preview) {
    document.title = String(n.title || "お知らせ") + "｜ケーキ屋さん こいまり 城東";
    // 「#recommended」のようなトップページ内の場所は、トップページのその場所へ飛ばす（このページには無いため）
    // ブログ（休止中）へのリンクは出さない（2026-10-19オーナー指示）
    const rawLink = n.url && n.url !== "#" && !/news\.html|blog\.html/.test(n.url) ? (n.url.charAt(0) === "#" ? "index.html" + n.url : n.url) : "";
    const linkIsIg = /^https:\/\/(www\.)?instagram\.com\//.test(rawLink);
    const link = linkIsIg ? "" : rawLink;
    const igUrl = /^https:\/\/(www\.)?instagram\.com\//.test(n.instaUrl || "") ? n.instaUrl : (linkIsIg ? rawLink : "https://www.instagram.com/_koimari_");
    const showIg = !!n.showInsta || linkIsIg;
    // カレンダーの見出し（管理画面で変更可。空欄なら「2026年10月の営業日カレンダー」）
    const calYm = /^(\d{4})-(\d{2})$/.exec(n.calMonth || "");
    const calTitle = n.calTitle || (calYm ? Number(calYm[1]) + "年" + Number(calYm[2]) + "月の営業日カレンダー" : "営業日カレンダー");
    // 営業日カレンダーを載せたお知らせで写真が無いときは、その月の季節の写真（season/MM-番号.jpg、管理画面で3枚から選択）
    const calM = n.showCalendar && /^\d{4}-(\d{2})$/.exec(n.calMonth || "");
    const photo = n.img || (calM ? "season/" + calM[1] + "-" + ([1, 2, 3].includes(Number(n.seasonPick)) ? Number(n.seasonPick) : 1) + ".jpg" : "");
    box.innerHTML = (preview ? '<p class="nw-preview">確認用の表示です（まだ公開されていません）</p>' : "") +
      '<div class="nw-head"><span class="nw-head__en">News</span><span class="nw-head__ja">お知らせ</span><span class="nw-head__line"></span></div>' +
      '<article class="nw-card">' +
      (photo ? '<div class="nw-card__media' + (n.img && !/^season\//.test(n.img) ? ' is-own' : '') + '"><img class="nw-card__photo" src="' + esc(photo) + '" alt=""></div>' : "") +
      '<div class="nw-card__body">' +
      '<div class="nw-meta"><span>' + esc(n.date) + "</span>" + (n.tag ? '<span class="nw-tag">' + esc(n.tag) + "</span>" : "") + "</div>" +
      '<h1 class="nw-title">' + esc(n.title) + "</h1><span class=\"nw-rule\"></span>" +
      (n.excerpt ? '<p class="nw-body">' + esc(n.excerpt) + "</p>" : "") +
      (link ? '<div class="nw-actions"><a class="nw-link" href="' + esc(link) + '"' + (preview ? ' target="_blank" rel="noopener"' : "") + '>詳しく見る</a></div>' : "") +
      (Array.isArray(n.picks) && n.picks.length ? '<section class="ev-products" id="evProducts"><h2 class="ev-products__title">' + (n.picksTitle ? esc(n.picksTitle) : "このページで紹介している商品") + '</h2><p class="ev-products__lead">気になる商品を押すと、くわしいページが開きます。</p><div class="ev-grid" id="evGrid"></div></section>' : "") +
      (showIg ? '<div class="nw-ig"><p>詳細はInstagramからもご確認いただけます。</p><a class="nw-ig-btn" href="' + esc(igUrl) + '" target="_blank" rel="noopener">Instagramで見る →</a></div>' : "") +
      (n.showCalendar ? '<section class="nw-calsec"><h2 class="nw-calsec__title">' + esc(calTitle) + '</h2><p class="nw-calsec__lead">ご来店の前にご確認ください。お休みの日は「休」、日付の下の数字はその日の営業時間です。</p><div class="nw-cal"><iframe id="nwCal" title="' + esc(calTitle) + '" src="calendar.html?embed=1' + (n.calMonth ? "&m=" + encodeURIComponent(n.calMonth) : "") + '"></iframe></div></section>' : "") +
      "</div></article>" +
      '<a class="nw-back" href="index.html#news"' + (preview ? ' target="_blank" rel="noopener"' : "") + '>← お知らせ一覧へ</a>';
    // 特設ページのテーマ（ハロウィン・クリスマスなど）。見出しの「お知らせ」の代わりにテーマの見出しと飾りを出す
    if (n.theme && window.KoimariEventTheme && window.KoimariEventTheme.THEMES[n.theme] && !document.body.classList.contains("ev-on")) {
      const head = box.querySelector(".nw-head"); if (head) head.style.display = "none";
      window.KoimariEventTheme.apply(n.theme, box.querySelector(".nw-card"));
    }
    if (Array.isArray(n.picks) && n.picks.length) renderPicks(n.picks, preview);
  }
  // 選ばれた商品を、最新の商品データ（写真・名前・価格）で並べる。消えた・非公開の商品は出さない
  async function renderPicks(picks, preview) {
    const grid = document.getElementById("evGrid"); if (!grid) return;
    const keys = Array.from(new Set(picks.map((p) => p.k).filter(Boolean)));
    const lists = {};
    await Promise.all(keys.map(async (k) => { try { const v = await (await fetch(DB + "/siteImages/" + k + ".json")).json(); lists[k] = Array.isArray(v) ? v : Object.values(v || {}); } catch (e) { lists[k] = []; } }));
    const plain = (t) => String(t || "").replace(/<[^>]*>/g, "").trim();
    const items = picks.map((p) => {
      const list = lists[p.k] || [];
      let idx = list.findIndex((it) => it && plain(it.name) === plain(p.name));
      if (idx < 0) return null;
      const it = list[idx];
      if (!it || it.visible === false || !it.img) return null;
      return { it, idx, type: p.type };
    }).filter(Boolean);
    if (!items.length) { const sec = document.getElementById("evProducts"); if (sec) sec.remove(); return; }
    grid.innerHTML = items.map(({ it, idx, type }) => {
      const name = plain(it.name);
      const price = it.price && /[1-9]/.test(String(it.price)) ? String(it.price) : "";
      return '<a class="ev-item" href="product.html?type=' + esc(type) + "&idx=" + idx + "&n=" + encodeURIComponent(name) + '"' + (preview ? ' target="_blank" rel="noopener"' : "") + '>' +
        '<img src="' + esc(it.img) + '" alt="' + esc(name) + '" loading="lazy">' +
        '<div class="ev-item__name">' + esc(name) + "</div>" + (price ? '<div class="ev-item__price">' + esc(price) + "</div>" : "") + "</a>";
    }).join("");
  }
  // 管理画面の「お客様からの見え方を確認」：保存前の内容を管理画面から受け取って表示する（2026-10-18）
  if (q.get("preview") === "1" && window.parent !== window) {
    window.addEventListener("message", (e) => {
      if (e.source !== window.parent || e.origin !== location.origin || !e.data || !e.data.koimariNewsPreview) return;
      render(e.data.koimariNewsPreview, true);
    });
    window.parent.postMessage({ koimariNewsPreviewReady: true }, location.origin);
  } else {
    fetch(DB + "/koimariContent/news.json").then((r) => r.json()).then((v) => {
      const list = Array.isArray(v) ? v : Object.values(v || {});
      const n = list.find((x) => x && id && x.id === id) || (isFinite(idx) ? list[idx] : null);
      if (!n || n.visible === false) { box.innerHTML = '<p class="nw-empty">このお知らせは見つかりませんでした。</p><a class="nw-back" href="index.html#news">← お知らせ一覧へ</a>'; return; }
      render(n, false);
    }).catch(() => { box.innerHTML = '<p class="nw-empty">読み込みに失敗しました。少し待ってから再読み込みしてください。</p>'; });
  }
  // カレンダーの高さに合わせて枠を伸ばす
  window.addEventListener("message", (e) => { const f = document.getElementById("nwCal"); if (f && e.data && e.data.koimariCalHeight) f.style.height = e.data.koimariCalHeight + "px"; });
})();
</script>
</body>
</html>
