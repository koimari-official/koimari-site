<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23f7f3ee'/><text x='50' y='62' font-family='serif' font-size='44' font-style='italic' fill='%23c9a96e' text-anchor='middle'>K</text></svg>">
<title>営業日カレンダー｜ケーキ屋さん こいまり 城東</title>
<meta name="description" content="ケーキ屋さん こいまり 城東の営業日カレンダーです。定休日・臨時休業日・営業時間をご確認いただけます。">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--color-bg:#f7f3ee;--color-bg-soft:#ede3d4;--color-text:#2e2118;--color-text-soft:#4a3a2a;--color-accent:#c9a96e;--color-accent-dark:#a88a52;--color-gold:#c9a96e;--color-line:#d8baa4;--color-info:#4a6f9c;--color-line-soft:#e8d4bc;--color-on-accent:#2e1a00;--color-mom:#c75a6e;--color-mom-deep:#9a3d50;--font-mincho:"Shippori Mincho","游明朝","Yu Mincho",serif;--font-sans:"Noto Sans JP","ヒラギノ角ゴ ProN",sans-serif;--font-en:"Cormorant Garamond",serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);color:var(--color-text);background:var(--color-bg);line-height:1.9;font-size:20px;font-weight:600;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.cal-head{background:linear-gradient(135deg,#5c4a38 0%,#4a3a2a 100%);color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cal-head__logo{display:flex;align-items:center;gap:12px}
.cal-head__logo img{width:52px;height:52px;object-fit:contain}
.cal-head__en{font-family:var(--font-en);font-size:28px;letter-spacing:.2em;color:var(--color-accent);font-weight:700;line-height:1}
.cal-head__jp{font-family:var(--font-mincho);font-size:15px;letter-spacing:.08em;margin-top:6px;white-space:nowrap}
.cal-head__tel{font-family:var(--font-sans);font-size:22px;font-weight:800;letter-spacing:.02em;color:var(--color-accent);white-space:nowrap}
.cal-head__close{font-family:var(--font-mincho);font-size:16px;color:#e8dcc8;border:1px solid rgba(232,220,200,.45);border-radius:999px;padding:8px 20px;cursor:pointer;background:none}
.cal-head__close:hover{border-color:var(--color-accent);color:var(--color-accent)}

main{padding:28px 24px 56px}
.cal-title{text-align:center;margin-bottom:18px}
.cal-title__en{font-family:var(--font-en);font-style:italic;color:var(--color-accent-dark);letter-spacing:.3em;font-size:17px;display:block;margin-bottom:6px}
.cal-title__jp{font-family:var(--font-mincho);font-size:clamp(26px,3.2vw,34px);letter-spacing:.14em;font-weight:700}

/* カレンダー本体。トップページの営業日カレンダーと同じ配色・記号にそろえている。
   別タブで大きく見るためのページなので、横幅と文字はトップページより大きめ（2026-09-29新設）。 */
.bcal__wrap{max-width:1100px;margin:0 auto;background:#fff;border:1px solid var(--color-line);padding:20px 26px 24px}
.bcal__header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:12px}
.bcal__nav{display:flex;align-items:center;gap:16px}
.bcal__nav button{width:46px;height:46px;background:var(--color-bg-soft);border:1px solid var(--color-line);cursor:pointer;font-size:17px;transition:all .2s;color:var(--color-text)}
.bcal__nav button:hover{background:var(--color-accent);color:var(--color-on-accent);border-color:var(--color-accent-dark);transform:scale(1.08)}
.bcal__title{font-family:var(--font-mincho);font-size:26px;letter-spacing:.08em;min-width:220px;text-align:center;font-weight:700}
.bcal__today{font-family:var(--font-mincho);font-size:16px;border:1px solid var(--color-line);background:#fff;padding:9px 20px;cursor:pointer;border-radius:999px;color:var(--color-text-soft);white-space:nowrap;line-height:1.2}
.bcal__today:hover{border-color:var(--color-accent-dark);color:var(--color-accent-dark)}
.bcal__legend{display:flex;gap:20px;font-size:16px;color:var(--color-text-soft);flex-wrap:wrap}
.bcal__legend span{display:inline-flex;align-items:center;gap:8px}
.bcal__legend i{display:inline-block;width:16px;height:16px;border-radius:2px}
.bcal__grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.bcal__dow{text-align:center;padding:8px 0;font-family:var(--font-mincho);font-size:17px;font-weight:700;background:var(--color-bg-soft);letter-spacing:.06em}
.bcal__dow.sat{color:var(--color-info)}
.bcal__dow.sun{color:var(--color-accent-dark)}
.bcal__cell{padding:8px 4px 6px;border:1px solid var(--color-line-soft);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;font-family:var(--font-sans);font-size:22px;font-weight:600;position:relative;overflow:hidden;min-height:96px}
.bcal__cell.empty{border:none}
.bcal__cell.closed{background:rgba(201,169,110,.12);color:var(--color-accent-dark)}
.bcal__cell.closed::after{content:"休";font-family:var(--font-mincho);font-size:20px;color:var(--color-accent-dark);margin-top:auto;font-weight:700}
.bcal__cell.today{background:var(--color-bg-soft);border-color:var(--color-accent-dark);font-weight:800;border-width:2px}
.bcal__cell.today::before{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--color-accent)}
.bcal__cell.holiday{color:var(--color-accent-dark)}
.bcal__cell.saturday{color:var(--color-info)}
.bcal__cell.has-event{background:linear-gradient(180deg,#fff 0%,#fdf5f3 100%)}
.bcal__cell.has-event:not(.closed){border-color:var(--color-mom)}
.bcal__cell-event{font-family:var(--font-mincho);font-size:14px;color:var(--color-mom-deep);font-weight:700;letter-spacing:.02em;line-height:1.35;text-align:center;margin-top:4px}
.bcal__note{max-width:1100px;margin:18px auto 0;font-size:18px;color:var(--color-text-soft);text-align:center;line-height:1.9}
.bcal__note strong{color:var(--color-text);font-weight:800}
.cal-back{display:block;max-width:1100px;margin:26px auto 0;text-align:center;font-size:17px;color:var(--color-text-soft)}
.cal-back a{text-decoration:underline;text-underline-offset:3px}

@media(max-width:700px){
  body{font-size:18px}
  main{padding:20px 12px 40px}
  .bcal__wrap{padding:14px 10px 18px;border-left:none;border-right:none}
  .bcal__cell{min-height:62px;font-size:18px;padding:5px 2px}
  .bcal__cell.closed::after{font-size:15px}
  .bcal__cell-event{font-size:11px}
  .bcal__title{font-size:21px;min-width:150px}
  .bcal__nav button{width:40px;height:40px}
  .bcal__legend{font-size:14px;gap:12px}
  .bcal__dow{font-size:15px}
  .bcal__note{font-size:16px}
}
</style>
</head>
<body>
<header class="cal-head">
  <div class="cal-head__logo">
    <img src="koimari-temari-mark.png" alt="">
    <div>
      <div class="cal-head__en">KOIMARI</div>
      <div class="cal-head__jp">ケーキ屋さん こいまり 城東</div>
    </div>
  </div>
  <a class="cal-head__tel" href="tel:07091580641">070-9158-0641</a>
  <button type="button" class="cal-head__close" id="calClose">このタブを閉じる</button>
</header>

<main>
  <div class="cal-title">
    <span class="cal-title__en">Open Days</span>
    <h1 class="cal-title__jp">営業日カレンダー</h1>
  </div>

  <div class="bcal__wrap">
    <div class="bcal__header">
      <div class="bcal__nav">
        <button id="bcalPrev" aria-label="前の月">◀</button>
        <div class="bcal__title" id="bcalTitle"></div>
        <button id="bcalNext" aria-label="次の月">▶</button>
        <button type="button" class="bcal__today" id="bcalToday">今月</button>
      </div>
      <div class="bcal__legend">
        <span><i style="background:rgba(201,169,110,.2);border:1px solid rgba(201,169,110,.5);"></i>定休日・臨時休業</span>
        <span><i style="background:#fff;border:2px solid var(--color-accent-dark);"></i>本日</span>
      </div>
    </div>
    <div class="bcal__grid" id="bcalGrid"></div>
  </div>

  <p class="bcal__note">
    基本定休日：<strong>月曜日</strong>（月曜が祝日の場合は営業します）<br>
    営業時間：火曜～土曜 <strong>10:00～20:00</strong> ／ 日曜（月曜祝日） <strong>10:00～19:00</strong><br>
    臨時休業や営業時間の変更がある場合は、このカレンダーに反映しています。
  </p>
  <p class="cal-back">このページは別のタブで開いています。<a href="index.html">こいまりのトップページはこちら</a></p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBMnJaIuF2vohO0YqKVmbcWeMBt9ZmSACI",
  authDomain: "koimari-tasting.firebaseapp.com",
  databaseURL: "https://koimari-tasting-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "koimari-tasting",
  storageBucket: "koimari-tasting.firebasestorage.app",
  messagingSenderId: "852851855633",
  appId: "1:852851855633:web:1bb5765680a137f20abcb0"
};
const db = getDatabase(initializeApp(firebaseConfig));

// 定休日データはトップページと同じ koimariContent/holidays（管理画面「営業日設定」）を見る。
const DEFAULT_HOLIDAYS = { weeklyClosed:[1], extraClosed:[] };
let holidays = (()=>{ try{ const r=localStorage.getItem("koimari_holidays"); if(r) return JSON.parse(r); }catch(e){} return DEFAULT_HOLIDAYS; })();

// 国民の祝日（内閣府発表分、2026-2027年）。定休日(月曜)が祝日と重なる日は営業する。
// index.html・functions/index.js と同じデータ・同じロジックを保つこと。
const JP_HOLIDAYS = new Set([
  "2026-01-01","2026-01-12","2026-02-11","2026-02-23","2026-03-20","2026-04-29",
  "2026-05-03","2026-05-04","2026-05-05","2026-05-06","2026-07-20","2026-08-11",
  "2026-09-21","2026-09-22","2026-09-23","2026-10-12","2026-11-03","2026-11-23",
  "2027-01-01","2027-01-11","2027-02-11","2027-02-23","2027-03-21","2027-03-22",
  "2027-04-29","2027-05-03","2027-05-04","2027-05-05","2027-07-19","2027-08-11",
  "2027-09-20","2027-09-23","2027-10-11","2027-11-03","2027-11-23"
]);
function isWeeklyClosedDay(h,dow,k){ return (h.weeklyClosed||[]).includes(dow) && !JP_HOLIDAYS.has(k); }

const EVENTS = {
  "01-01":"元日","02-03":"節分","02-14":"バレンタイン",
  "03-03":"ひな祭り","03-14":"ホワイトデー","05-05":"こどもの日",
  "07-07":"七夕","08-13":"お盆入り","08-14":"お盆","08-15":"お盆","08-16":"送り火",
  "09-09":"重陽","10-31":"ハロウィン","11-15":"七五三",
  "12-24":"クリスマス・イブ","12-25":"クリスマス","12-31":"大晦日",
  "2026-05-10":"母の日","2026-06-21":"父の日","2026-09-21":"敬老の日",
  "2026-03-21":"春のお彼岸","2026-09-23":"秋のお彼岸",
  "2026-07-15":"お中元シーズン","2026-12-15":"お歳暮シーズン"
};

let bcalMonth = new Date(); bcalMonth.setDate(1);

function renderBcal(){
  const h = holidays || DEFAULT_HOLIDAYS;
  const year = bcalMonth.getFullYear(), month = bcalMonth.getMonth();
  document.getElementById("bcalTitle").textContent = year + "年 " + (month+1) + "月";
  const grid = document.getElementById("bcalGrid"); grid.innerHTML = "";
  ["日","月","火","水","木","金","土"].forEach((d,i)=>{
    const e=document.createElement("div");
    e.className="bcal__dow"+(i===0?" sun":i===6?" sat":"");
    e.textContent=d; grid.appendChild(e);
  });
  const fd=new Date(year,month,1), ld=new Date(year,month+1,0);
  const t=new Date();
  const tk=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
  for(let i=0;i<fd.getDay();i++){ const c=document.createElement("div"); c.className="bcal__cell empty"; grid.appendChild(c); }
  for(let d=1; d<=ld.getDate(); d++){
    const cd=new Date(year,month,d);
    const mm=String(month+1).padStart(2,"0"), dd=String(d).padStart(2,"0");
    const k=year+"-"+mm+"-"+dd, mmdd=mm+"-"+dd, dow=cd.getDay();
    const closed=isWeeklyClosedDay(h,dow,k)||(h.extraClosed||[]).includes(k);
    const eventName=EVENTS[k]||EVENTS[mmdd]||"";
    const cell=document.createElement("div"); cell.className="bcal__cell";
    if(dow===0) cell.classList.add("holiday"); else if(dow===6) cell.classList.add("saturday");
    if(closed) cell.classList.add("closed");
    if(k===tk) cell.classList.add("today");
    if(eventName&&!closed) cell.classList.add("has-event");
    let inner="<div>"+d+"</div>";
    if(eventName&&!closed) inner+='<div class="bcal__cell-event">'+eventName+"</div>";
    cell.innerHTML=inner;
    grid.appendChild(cell);
  }
}
document.getElementById("bcalPrev").addEventListener("click",()=>{ bcalMonth.setMonth(bcalMonth.getMonth()-1); renderBcal(); });
document.getElementById("bcalNext").addEventListener("click",()=>{ bcalMonth.setMonth(bcalMonth.getMonth()+1); renderBcal(); });
document.getElementById("bcalToday").addEventListener("click",()=>{ bcalMonth=new Date(); bcalMonth.setDate(1); renderBcal(); });
document.getElementById("calClose").addEventListener("click",()=>{
  window.close();
  // 別タブで開かれていない場合はwindow.close()が効かないため、トップページへ戻す
  setTimeout(()=>{ if(!document.hidden) location.href="index.html"; }, 300);
});
renderBcal();

onValue(ref(db, "koimariContent/holidays"), (snap)=>{
  const v = snap.val();
  if(!v) return;
  holidays = v;
  try{ localStorage.setItem("koimari_holidays", JSON.stringify(v)); }catch(e){}
  renderBcal();
});
</script>
</body>
</html>
