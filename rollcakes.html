<script>
const DEFAULT_ROLLCAKES = [];
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function loadRollcakes(){
  try{
    const s = localStorage.getItem("koimari_images");
    if(s){ const p = JSON.parse(s); return p.rollcakes || DEFAULT_ROLLCAKES; }
  }catch(e){}
  return DEFAULT_ROLLCAKES;
}
function renderGrid(){
  const grid = document.getElementById("productGrid");
  grid.innerHTML = "";
  const items = loadRollcakes().filter(it => it.visible !== false);
  if(!items.length){
    grid.innerHTML = '<div class="empty">ただいま準備中です。</div>';
    return;
  }
  items.forEach((it, i) => {
    const a = document.createElement("a");
    a.href = "product.html?type=rollcake&idx=" + i;
    a.className = "prod-card";
    a.innerHTML = `
      <div class="prod-card__img"><img src="${esc(it.img)}" alt="${esc(it.name)}" loading="lazy"></div>
      <div class="prod-card__body">
        <h3 class="prod-card__title">${esc(it.name)}</h3>
        <div class="prod-card__price">${esc(it.price)}</div>
        <p class="prod-card__desc">${esc(it.desc)}</p>
      </div>`;
    grid.appendChild(a);
  });
}
window.renderRollcakeGrid = renderGrid;
renderGrid();
</script>

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

const firebaseConfig = {
  apiKey: "AIzaSyBMnJaIuF2vohO0YqKVmbcWeMBt9ZmSACI",
  authDomain: "koimari-tasting.firebaseapp.com",

  projectId: "koimari-tasting",

  appId: "1:852851855633:web:1bb5765680a137f20abcb0"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

onValue(ref(db, "siteImages"), (snapshot) => {
  const data = snapshot.val();
  if (!data) return;
  try {
    const cur = JSON.parse(localStorage.getItem("koimari_images") || "{}");
    if (data.rollcakes) cur.rollcakes = data.rollcakes;
    localStorage.setItem("koimari_images", JSON.stringify(cur));
  } catch(e) {}
  if (typeof window.renderRollcakeGrid === "function") window.renderRollcakeGrid();
});
</script>
