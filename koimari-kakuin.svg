<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="inkTexture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" seed="7"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5"/>
    </filter>
  </defs>
  <g filter="url(#inkTexture)">
    <!-- 外枠(角印の四角い縁取り、二重線) -->
    <rect x="10" y="10" width="180" height="180" fill="none" stroke="#b3261e" stroke-width="9"/>
    <rect x="20" y="20" width="160" height="160" fill="none" stroke="#b3261e" stroke-width="2.5"/>
    <!-- 「こいまり」を右上→右下→左上→左下の順(右から左へ読む伝統的な配置、マス目の仕切り線なし) -->
    <text x="140" y="70" text-anchor="middle" dominant-baseline="central"
      font-family="'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho','MS Mincho',serif" font-weight="900" font-size="56" fill="#b3261e" stroke="#b3261e" stroke-width="2.5" paint-order="stroke fill">こ</text>
    <text x="140" y="150" text-anchor="middle" dominant-baseline="central"
      font-family="'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho','MS Mincho',serif" font-weight="900" font-size="56" fill="#b3261e" stroke="#b3261e" stroke-width="2.5" paint-order="stroke fill">い</text>
    <text x="60" y="70" text-anchor="middle" dominant-baseline="central"
      font-family="'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho','MS Mincho',serif" font-weight="900" font-size="56" fill="#b3261e" stroke="#b3261e" stroke-width="2.5" paint-order="stroke fill">ま</text>
    <text x="60" y="150" text-anchor="middle" dominant-baseline="central"
      font-family="'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho','MS Mincho',serif" font-weight="900" font-size="56" fill="#b3261e" stroke="#b3261e" stroke-width="2.5" paint-order="stroke fill">り</text>
  </g>
</svg>
