<style>
:root{--color-bg: #f7f3ee;--color-bg-soft: #ede3d4;--color-paper:#fefcf8;--color-text:#2e2118;--color-text-soft: #4a3a2a;--color-accent: #c9a96e;--color-accent-dark: #a88a52;--color-gold: #c9a96e;--color-line: #d8baa4;--font-mincho:"Shippori Mincho",serif;--font-sans:"Noto Sans JP",sans-serif;--font-en:"Cormorant Garamond",serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);color:var(--color-text);background:var(--color-bg);line-height:1.9;font-size:21px;font-weight:600;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
.header{position:relative;overflow:hidden;background:linear-gradient(135deg,#5c4a38 0%,#4a3a2a 100%)}
.header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--color-gold),transparent)}
.header__inner{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:22px 24px;display:flex;align-items:center;justify-content:space-between}
.header__logo{display:flex;align-items:center;gap:10px;line-height:1}
.header__logo-mark{width:82px;height:82px;object-fit:contain}
.header__logo-text{display:flex;flex-direction:column;line-height:1}
.header__logo-en{font-family:var(--font-en);font-size:40px;font-style:normal;letter-spacing:.2em;color:var(--color-accent-dark);font-weight:700}
.header__logo-jp{font-family:var(--font-mincho);font-size:18px;letter-spacing:.08em;color:#fff;font-weight:600;margin-top:8px;white-space:nowrap}
.back-link{font-family:var(--font-mincho);font-size:18px;color:#e8dcc8;letter-spacing:.08em;font-weight:500}
.back-link:hover{color:var(--color-accent-dark)}
.nav-link{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;font-family:var(--font-mincho);font-size:14px;letter-spacing:.06em;color:var(--color-text-soft);font-weight:600;position:relative;transition:color .22s;white-space:nowrap}
.nav-link::after{content:'';position:absolute;left:16px;right:16px;bottom:2px;height:1px;background:var(--color-gold);transform:scaleX(0);transform-origin:center;transition:transform .25s ease}
.nav-link:hover{color:var(--color-accent-dark)}
.nav-link:hover::after{transform:scaleX(1)}
.sub-nav{background:var(--color-bg-soft);border-bottom:1px solid var(--color-line)}
.sub-nav ul{max-width:1180px;margin:0 auto;display:flex;justify-content:center;flex-wrap:wrap;align-items:center;gap:2px;list-style:none;padding:10px 8px}
.page-head{position:relative;text-align:center;padding:48px 24px 42px;background:linear-gradient(180deg,var(--color-bg-soft) 0%,#efe3d2 100%);overflow:hidden}
.page-head::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(60deg,transparent 0 38px,rgba(184,153,104,.05) 38px 39px),repeating-linear-gradient(-60deg,transparent 0 38px,rgba(184,153,104,.05) 38px 39px);pointer-events:none;opacity:.7}
.page-head__inner{position:relative;z-index:1}
.page-head__en{font-family:var(--font-en);font-style:italic;color:var(--color-accent-dark);letter-spacing:.3em;font-size:21px;display:inline-block;margin-bottom:14px;font-weight:500}
.page-head__title{font-family:var(--font-mincho);font-size:clamp(32px,4.2vw,42px);letter-spacing:.16em;font-weight:600;position:relative;display:inline-block;}
main{max-width:820px;margin:0 auto;padding:70px 24px 60px}

.product-main-img{width:100%;aspect-ratio:1/1;overflow:hidden;margin-bottom:16px;cursor:zoom-in;background:var(--color-bg-soft);border:1px solid var(--color-line)}
.product-main-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.product-main-img:hover img{transform:scale(1.03)}
.product-thumbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:50px}
.product-thumb{aspect-ratio:1/1;overflow:hidden;cursor:zoom-in;background:var(--color-bg-soft);border:1px solid var(--color-line)}
.gallery-gate{background:var(--color-bg-soft);border:1px solid var(--color-line);padding:34px 26px;text-align:center;margin-bottom:50px}
.gallery-gate__text{font-size:15px;line-height:1.9;margin-bottom:24px}
.gallery-gate__actions{display:flex;flex-direction:column;gap:14px;align-items:center}
.gallery-gate__btn{display:inline-block;padding:16px 40px;font-family:var(--font-mincho);font-size:14.5px;letter-spacing:.1em;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.gallery-gate__btn--line{background:#06c755;color:#fff;box-shadow:0 4px 14px rgba(6,199,85,.25)}
.gallery-gate__btn--line:hover{background:#05b34c;transform:translateY(-2px)}
.gallery-gate__btn--enter{background:transparent;color:var(--color-accent-dark);border:1px solid var(--color-accent);font-size:13.5px;padding:13px 32px}
.gallery-gate__btn--enter:hover{background:var(--color-accent);color:#fff}
.product-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.product-thumb:hover img{transform:scale(1.08)}
.product-reserve{text-align:center;margin:-20px 0 50px}.product-reserve__btn{font-family:var(--font-mincho);font-size:18px;font-weight:700;letter-spacing:.06em;color:#fff;background:#06c755;border:none;border-radius:999px;padding:16px 38px;cursor:pointer;box-shadow:0 6px 18px rgba(6,199,85,.28);transition:transform .25s,box-shadow .25s}.product-reserve__btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(6,199,85,.38)}.product-reserve__btn:disabled{opacity:.6;cursor:wait}.product-reserve__note{margin-top:12px;font-size:14px;color:var(--color-text-soft)}
.product-desc{font-family:var(--font-mincho);font-size:20px;font-weight:600;line-height:2.1;color:var(--color-text);margin-bottom:50px;padding:36px 40px;background:var(--color-paper);border:1px solid var(--color-line)}
.product-desc p{margin-bottom:1em}
.product-desc p:last-child{margin-bottom:0}
.product-back{text-align:center;margin-bottom:60px}
.product-back a{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mincho);font-size:18px;letter-spacing:.08em;color:var(--color-text-soft);padding:12px 10px;font-weight:500}
.product-back a:hover{color:var(--color-accent-dark)}

.cta-banner{margin-top:20px;background:linear-gradient(135deg,#2b1f1a 0%,#3d2c25 100%);color:#fff;padding:60px 40px;text-align:center;position:relative;overflow:hidden}
.cta-banner::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(60deg,transparent 0 60px,rgba(245,214,168,.06) 60px 61px),repeating-linear-gradient(-60deg,transparent 0 60px,rgba(245,214,168,.06) 60px 61px);opacity:.6}
.cta-banner__inner{position:relative;z-index:1}
.cta-banner__en{font-family:var(--font-en);font-style:italic;font-size:18px;letter-spacing:.3em;color:#f5d6a8;margin-bottom:18px;display:block;font-weight:500}
.cta-banner__title{font-family:var(--font-mincho);font-size:clamp(22px,3vw,28px);letter-spacing:.1em;margin-bottom:26px;font-weight:600;line-height:1.5}
.cta-banner__btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.cta-banner__btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:16px 40px;font-family:var(--font-mincho);font-size:15px;letter-spacing:.16em;font-weight:500;transition:all .25s}
.cta-banner__btn--primary{background:var(--color-accent);color:#fff}
.cta-banner__btn--primary:hover{background:var(--color-accent-dark);transform:translateY(-2px)}
.cta-banner__btn--ghost{background:transparent;color:#f5d6a8;border:1px solid #f5d6a8}
.cta-banner__btn--ghost:hover{background:#f5d6a8;color:#2b1f1a}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:1000;padding:30px;cursor:pointer}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:85vh;object-fit:contain}
.lightbox__close{position:absolute;top:20px;right:24px;font-size:38px;color:#fff;cursor:pointer;background:none;border:none;line-height:1}

.footer{background:#2b1f1a;color:#e3d5c2;padding:44px 24px;text-align:center;font-family:var(--font-en);font-size:15px;font-weight:600;letter-spacing:.18em}
.footer__mark{font-family:var(--font-mincho);font-size:13px;letter-spacing:.4em;color:#b09a82;margin-bottom:10px}

@media(max-width:700px){
  body{font-size:18px}
  .header__inner{flex-wrap:wrap;row-gap:12px}
  .header__logo-mark{width:56px;height:56px}
  .header__logo-en{font-size:26px}
  .header__logo-jp{font-size:15px}
  .back-link{font-size:16px}
  .page-head{padding:44px 22px 40px}
  main{padding:50px 16px 50px}
  .product-desc{padding:26px 24px;font-size:19px}
  .cta-banner{padding:44px 24px}
  .cta-banner__btns{flex-direction:column;align-items:stretch}
  .cta-banner__btn{padding:15px 26px;font-size:14px}
}
</style>
<style id="product-v2">
/* 商品紹介ページ（2026-10-02オーナー指示：写真はシズル感があるのに、ページ自体が購買意欲をそそらない）。
   写真を大きく横スワイプ、その横（スマホは下）に商品名・目安価格・サイズ・説明・予約ボタン・こだわりをまとめ、
   スマホは画面下に予約バーを固定、最後に同じカテゴリーのほかの商品を横スクロールで見せる。 */
.pd-crumb{max-width:1120px;margin:0 auto;padding:16px 24px 0;font-size:14px;color:var(--color-text-soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-weight:600}
.pd-crumb a{color:var(--color-accent-dark)}
main.pd{max-width:1120px;padding:20px 24px 60px}
.pd-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:start;margin-bottom:56px}
.pd-media{position:sticky;top:16px}
.pd-slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:18px;background:var(--color-bg-soft);box-shadow:0 18px 40px rgba(58,42,35,.16)}
.pd-slider::-webkit-scrollbar{display:none}
.pd-slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:1/1;cursor:zoom-in}
.pd-slide img{width:100%;height:100%;object-fit:cover}
.pd-dots{display:flex;justify-content:center;gap:8px;margin-top:12px}
.pd-dots button{width:9px;height:9px;border-radius:50%;border:none;background:#d8c7b3;padding:0;cursor:pointer}
.pd-dots button.is-active{background:var(--color-accent-dark);width:22px;border-radius:5px}
.pd-thumbs{display:flex;gap:10px;margin-top:12px;overflow-x:auto}
.pd-thumbs button{flex:0 0 auto;width:76px;height:76px;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;cursor:pointer;background:none;opacity:.75}
.pd-thumbs button.is-active{border-color:var(--color-accent);opacity:1}
.pd-thumbs img{width:100%;height:100%;object-fit:cover}
.pd-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pd-badge{font-family:var(--font-mincho);font-size:13px;font-weight:700;letter-spacing:.08em;padding:4px 14px;border-radius:999px;background:rgba(74,58,42,.9);color:#f5e4c6}
.pd-badge--popular{background:#b03b48;color:#fff}
.pd-no{font-family:var(--font-sans);font-size:14px;font-weight:700;color:var(--color-accent-dark);letter-spacing:.04em;align-self:center;margin-left:4px}
.pd-badge--custom{background:#c9a96e;color:#fff}
.pd-price__custom{font-family:var(--font-mincho);font-size:24px;color:#4a3a2a}
.pd-badge--seasonal{background:#f5d6a8;color:#4a3a2a}
.pd-en:empty{display:none}
.pd-en{display:block;font-family:var(--font-en);font-style:italic;color:var(--color-accent-dark);letter-spacing:.2em;font-size:17px;margin-bottom:4px}
.pd-title{font-family:var(--font-mincho);font-size:clamp(26px,3vw,36px);font-weight:700;letter-spacing:.06em;line-height:1.45;margin-bottom:14px}
.pd-price{font-family:var(--font-sans);font-size:30px;font-weight:700;color:#8a3a2a;margin-bottom:6px;min-height:0}
.pd-price small{font-size:14px;color:var(--color-text-soft);margin-left:6px;font-weight:600}
.pd-price__note{display:block;font-size:13px;color:var(--color-text-soft);font-weight:600;margin-top:2px}
.pd-chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.pd-chip{font-size:14px;font-weight:700;padding:6px 14px;border:1px solid var(--color-line);border-radius:999px;background:var(--color-paper)}
.pd-info .product-desc{font-size:18px;padding:0;background:none;border:none;margin-bottom:22px;line-height:2}
.pd-info .product-reserve{text-align:left;margin:0 0 22px}
.pd-info .product-reserve__btn{width:100%;font-size:19px;padding:18px 24px}
.pd-points{list-style:none;background:var(--color-paper);border:1px solid var(--color-line);border-radius:14px;padding:18px 20px}
.pd-points:empty{display:none}
.pd-points li{position:relative;padding-left:22px;font-size:15.5px;line-height:1.8;margin-bottom:8px}
.pd-points li:last-child{margin-bottom:0}
.pd-points li::before{content:"";position:absolute;left:4px;top:.75em;width:7px;height:7px;background:var(--color-gold);transform:rotate(45deg)}
.pd-points__head{font-family:var(--font-mincho);font-size:15px;font-weight:700;color:var(--color-accent-dark);letter-spacing:.1em;margin-bottom:8px;padding-left:0!important}
.pd-points__head::before{display:none}
.pd-related{margin-bottom:40px}
.pd-related__title{font-family:var(--font-mincho);font-size:22px;font-weight:700;letter-spacing:.08em;margin-bottom:16px}
.pd-related__row{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.pd-rel{flex:0 0 200px;scroll-snap-align:start;background:var(--color-paper);border:1px solid var(--color-line);border-radius:14px;overflow:hidden;transition:transform .25s,box-shadow .25s}
.pd-rel:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(58,42,35,.14)}
.pd-rel img{width:100%;aspect-ratio:1/1;object-fit:cover}
.pd-rel__body{padding:10px 12px 12px}
.pd-rel__name{font-family:var(--font-mincho);font-size:15px;font-weight:700;line-height:1.5}
.pd-rel__price{font-size:14px;font-weight:700;color:#8a3a2a;margin-top:2px}
.pd-sticky{position:fixed;left:0;right:0;bottom:0;z-index:900;background:rgba(254,252,248,.97);border-top:1px solid var(--color-line);box-shadow:0 -6px 20px rgba(58,42,35,.12);padding:10px 14px calc(10px + env(safe-area-inset-bottom));align-items:center;gap:12px}
.pd-sticky__price{font-size:18px;font-weight:700;color:#8a3a2a;white-space:nowrap}
.pd-sticky__btn{flex:1;font-family:var(--font-mincho);font-size:17px;font-weight:700;letter-spacing:.06em;color:#fff;background:#06c755;border:none;border-radius:999px;padding:14px 16px;cursor:pointer}
@media(max-width:860px){
  .pd-grid{grid-template-columns:1fr;gap:22px;margin-bottom:40px}
  .pd-media{position:static;margin:0 -16px}
  .pd-slider{border-radius:0;box-shadow:none}
  .pd-thumbs{display:none}
  main.pd{padding:12px 16px 40px}
  .pd-crumb{padding:12px 16px 0;font-size:13px}
  .pd-title{font-size:26px}
  .pd-price{font-size:26px}
  .pd-rel{flex-basis:44%}
  body.has-sticky{padding-bottom:84px}
}
@media(min-width:861px){.pd-sticky{display:none!important}}
</style>
<style id="nav-large">
/* ナビゲーション（2026-09-28）：ピル型ボタンは安っぽく見えるため、上質な和菓子店のような「金の細線で挟んだ、
   明朝体の文字リンク＋小さな金のひし形の区切り」に変更。文字は20pxで大きく、ホバー/フォーカスで金の下線が伸びる */
#globalNav,.sub-nav{background:var(--color-bg-soft,#ede3d4);border-top:1px solid var(--color-gold,#c9a96e);border-bottom:1px solid var(--color-gold,#c9a96e)}
#globalNav ul,.sub-nav ul{flex-wrap:nowrap;max-width:none;overflow:visible;gap:0;padding:12px 14px;justify-content:center;align-items:center}
#globalNav li,.sub-nav li{display:flex;align-items:center}
#globalNav li+li::before,.sub-nav li+li::before{content:"";flex-shrink:0;width:6px;height:6px;background:var(--color-gold,#c9a96e);transform:rotate(45deg);margin:0 clamp(5px,1.1vw,24px)}
#globalNav .nav-link,.sub-nav .nav-link{font-family:var(--font-mincho,"Shippori Mincho","Yu Mincho",serif);font-size:clamp(15px,1.45vw,20px);font-weight:700;letter-spacing:.06em;padding:4px 2px;border:none;border-radius:0;background:none;box-shadow:none;transform:none;color:var(--color-text,#2e2118);position:relative;transition:color .25s}
#globalNav .nav-link::after,.sub-nav .nav-link::after{content:"";display:block;position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--color-gold,#c9a96e);transform:scaleX(0);transform-origin:center;transition:transform .3s ease}
#globalNav .nav-link:hover,.sub-nav .nav-link:hover,#globalNav .nav-link:focus-visible,.sub-nav .nav-link:focus-visible{background:none;box-shadow:none;transform:none;color:var(--color-accent-dark,#a88a52)}
#globalNav .nav-link:hover::after,.sub-nav .nav-link:hover::after,#globalNav .nav-link:focus-visible::after,.sub-nav .nav-link:focus-visible::after{transform:scaleX(1)}
/* 900px以下は折り返し許可 */
@media(max-width:900px){#globalNav ul,.sub-nav ul{flex-wrap:wrap;gap:4px 0}}
@media(max-width:700px){#globalNav ul,.sub-nav ul{flex-wrap:wrap;gap:6px 20px;padding:10px 12px}#globalNav li+li::before,.sub-nav li+li::before{display:none}#globalNav .nav-link,.sub-nav .nav-link{font-size:17px;letter-spacing:.08em}}
</style>

<script>
const DEFAULT_CATEGORIES = [
  {name:"デコレーションケーキ",en:"Decoration Cake",img:"https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=600&q=80",desc:"特別な日にふさわしい、丸ごと一台のケーキです。誕生日や記念日のお祝いに、メッセージプレートを添えてお作りします。",gallery:[]},
  {name:"カットケーキ",en:"Cut Cake",img:"https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=600&q=80",desc:"毎日の食後やちょっとしたご褒美に。季節のフルーツを使った定番から限定フレーバーまで、日替わりで店頭に並びます。",gallery:[]},
  {name:"ロールケーキ",en:"Roll Cake",img:"https://images.unsplash.com/photo-1587668178277-295251f900ce?w=600&q=80",desc:"ふわふわのスポンジとクリームを丁寧に巻き上げました。手土産やご自宅用にも人気の一品です。",gallery:[]},
  {name:"焼き菓子",en:"Baked Sweets",img:"https://images.unsplash.com/photo-1499636136210-6f4ee915583e?w=600&q=80",desc:"マドレーヌやフィナンシェなど、日持ちする焼き菓子の詰め合わせ。贈り物にも喜ばれています。",gallery:[]},
  {name:"ギフト",en:"Gift",img:"https://images.unsplash.com/photo-1549007994-cb92caebd54b?w=600&q=80",desc:"大切な方への贈り物に。ラッピングや熨斗のご相談も承っております。",gallery:[]}
];
const DEFAULT_RECOMMENDED = [
  {name:"苺のショートケーキ",nameEn:"Strawberry Shortcake",price:"¥520",img:"https://images.unsplash.com/photo-1558961363-fa8fdf82db35?w=500&q=80",desc:"地元農家から届く朝採れ苺をふんだんに使用した、当店の看板商品です。",gallery:[]},
  {name:"ガトーショコラ",nameEn:"Gateau au Chocolat",price:"¥480",img:"https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=500&q=80",desc:"濃厚なチョコレートをじっくりと焼き上げました。しっとりとした食感が自慢です。",gallery:[]},
  {name:"モンブラン",nameEn:"Mont Blanc",price:"¥560",img:"https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=500&q=80",desc:"栗の風味を存分に楽しめる人気商品。渋皮栗のペーストを使用しています。",gallery:[]},
  {name:"フルーツタルト",nameEn:"Seasonal Fruit Tart",price:"¥620",img:"https://images.unsplash.com/photo-1488477181946-6428a0291777?w=500&q=80",desc:"季節ごとに変わるフルーツをたっぷりと盛り付けた、彩り豊かなタルトです。",gallery:[]},
  {name:"マドレーヌ",nameEn:"Madeleine",price:"¥220",img:"https://images.unsplash.com/photo-1499636136210-6f4ee915583e?w=500&q=80",desc:"バターの香り豊かな、しっとり食感の焼き菓子です。",gallery:[]},
  {name:"フィナンシェ",nameEn:"Financier",price:"¥240",img:"https://images.unsplash.com/photo-1509440159596-0249088772ff?w=500&q=80",desc:"アーモンドの香ばしさが際立つ、上品な味わいの焼き菓子です。",gallery:[]},
  {name:"プリン",nameEn:"Crème Caramel",price:"¥380",img:"https://images.unsplash.com/photo-1488477181946-6428a0291777?w=500&q=80",desc:"卵とミルクの優しい甘さに、ほろ苦いカラメルを添えました。",gallery:[]},
  {name:"アップルパイ",nameEn:"Apple Pie",price:"¥460",img:"https://images.unsplash.com/photo-1535920527002-b35e96722eb9?w=500&q=80",desc:"りんごをじっくり煮込み、サクサクのパイ生地で包みました。",gallery:[]}
];
const DEFAULT_DECORATION_CAKES = [];
const DEFAULT_CUTCAKES = [];
const DEFAULT_ROLLCAKES = [];
const DEFAULT_BAKED = [];
const DEFAULT_GIFT = [];

const TYPE_CONFIG = {
  category:       { key: "categories", back: "index.html#categories", enField: "en" },
  recommended:    { key: "recommended", back: "index.html#recommended", enField: "nameEn" },
  decorationCake: { key: "decorationCakes", back: "gallery.html?cat=cake", enField: "nameEn" },
  cutcake:        { key: "cutcakes",   back: "gallery.html?cat=cutcake", enField: "nameEn" },
  rollcake:       { key: "rollcakes",  back: "gallery.html?cat=roll", enField: "nameEn" },
  baked:          { key: "baked",      back: "gallery.html?cat=baked", enField: "nameEn" },
  gift:           { key: "gift",       back: "gallery.html?cat=gift", enField: "nameEn" }
};

function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function nl2p(s){return esc(String(s||"").replace(/<\s*br\s*\/?\s*>/gi,"\n")).split(/\n+/).filter(Boolean).map(p=>`<p>${p}</p>`).join('');}

function loadImages(){
  try{
    const s = localStorage.getItem("koimari_images");
    if(s){
      const p = JSON.parse(s);
      return {
        categories: p.categories||DEFAULT_CATEGORIES,
        recommended: p.recommended||DEFAULT_RECOMMENDED,
        decorationCakes: p.decorationCakes||DEFAULT_DECORATION_CAKES,
        cutcakes: p.cutcakes||DEFAULT_CUTCAKES,
        rollcakes: p.rollcakes||DEFAULT_ROLLCAKES,
        baked: p.baked||DEFAULT_BAKED,
        gift: p.gift||DEFAULT_GIFT
      };
    }
  }catch(e){}
  return { categories: DEFAULT_CATEGORIES, recommended: DEFAULT_RECOMMENDED, decorationCakes: DEFAULT_DECORATION_CAKES, cutcakes: DEFAULT_CUTCAKES, rollcakes: DEFAULT_ROLLCAKES, baked: DEFAULT_BAKED, gift: DEFAULT_GIFT };
}

const params = new URLSearchParams(location.search);
const productType = TYPE_CONFIG[params.get('type')] ? params.get('type') : 'category';
const productIdx = parseInt(params.get('idx'), 10);

function openLightbox(src, alt){
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightboxImg').alt = alt;
  document.getElementById('lightbox').classList.add('show');
}
document.getElementById('lightbox').addEventListener('click', () => document.getElementById('lightbox').classList.remove('show'));
document.getElementById('lightboxClose').addEventListener('click', e => { e.stopPropagation(); document.getElementById('lightbox').classList.remove('show'); });

// Firebaseとの同期完了前はlist（IMAGES[config.key]）が空配列のことがあり、直リンク等で
// 開いた場合に一瞬「見つかりませんでした」という誤った案内が出てしまう（2026-09-07判明、
// cutcakes.html/rollcakes.htmlと同種の不具合）。未同期時は読み込み中の案内に留める。
window.firebaseSynced = false;
function renderProductPage(){
  const IMAGES = loadImages();
  const config = TYPE_CONFIG[productType];
  const list = IMAGES[config.key];
  const item = Array.isArray(list) ? list[productIdx] : null;
  document.getElementById('backToSection').href = config.back;

  if(!item){
    document.getElementById('pageEn').textContent = 'Koimari';
    document.getElementById('productPhotos').innerHTML = '';
    if (!window.firebaseSynced) {
      document.getElementById('pageTitle').textContent = '読み込み中…';
      document.getElementById('productDesc').innerHTML = '<p>読み込み中です。しばらくお待ちください。</p>';
      return;
    }
    document.getElementById('pageTitle').textContent = '見つかりませんでした';
    document.getElementById('productDesc').innerHTML = '<p>お探しの商品ページが見つかりませんでした。恐れ入りますが、トップページからご覧ください。</p>';
    return;
  }

  const displayName = item.name || '';
  const plainName = displayName.replace(/<\s*br\s*\/?\s*>/gi, ' ').trim();
  document.getElementById('pageEn').textContent = item[config.enField] || '';
  document.getElementById('pageTitle').innerHTML = esc(displayName).replace(/&lt;\s*br\s*\/?\s*&gt;/gi, '<br>');
  document.title = plainName + '｜こいまり';

  const photos = [item.img].concat(Array.isArray(item.gallery) ? item.gallery : []).filter(Boolean);
  // カテゴリページ（デコレーションケーキ等）の追加写真は、LINE公式アカウントの友だち追加を促す導線として
  // 未解除の状態では隠しておく（2026-09-05オーナー指示）。友だち追加済みの申告でブラウザごとに解除。
  const GATE_KEY = 'koimari_line_gallery_unlocked';
  const needsGate = productType === 'category' && photos.length > 1 && localStorage.getItem(GATE_KEY) !== '1';
  renderMedia(photos, plainName, needsGate);
  if (needsGate) {
    const gate = document.createElement('div');
    gate.className = 'gallery-gate';
    gate.style.marginTop = '16px';
    gate.innerHTML = '<p class="gallery-gate__text">こちらの商品ギャラリー（追加写真）は、LINE公式アカウントの友だち追加（会員登録）をされた方にご覧いただけます。</p><div class="gallery-gate__actions"><a href="https://lin.ee/tgXqHoK" target="_blank" rel="noopener" class="gallery-gate__btn gallery-gate__btn--line">LINE公式アカウントを友だち追加する</a><button type="button" class="gallery-gate__btn gallery-gate__btn--enter">友だち追加済みの方はこちら（ギャラリーを見る）</button></div>';
    document.getElementById('productPhotos').appendChild(gate);
    gate.querySelector('button').addEventListener('click', () => { try { localStorage.setItem(GATE_KEY, '1'); } catch(e){} renderMedia(photos, plainName, false); });
  }
  renderInfo(item, plainName, config);
  const body = window.KoimariPriceHint ? window.KoimariPriceHint.descBody(item) : item.desc;
  document.getElementById('productDesc').innerHTML = body ? nl2p(body) : '<p>詳しい説明は準備中です。</p>';

  // 2026-09-24：選んだ商品を予約フォームへ引き継ぐ（友だち追加の前後でも消えないよう、
  // 選択内容はサーバーにコード付きで保存する。詳細はreserve-draft.js参照）。
  // ここでのカテゴリー(type=category)は商品ではないため対象外。
  const oldReserve = document.getElementById('productReserve');
  if (oldReserve) oldReserve.remove();
  if (productType !== 'category' && productType !== 'recommended' && window.KoimariDraft) {
    const box = document.createElement('div');
    box.id = 'productReserve';
    box.className = 'product-reserve';
    box.innerHTML = '<button type="button" class="product-reserve__btn">この商品でご予約に進む →</button><p class="product-reserve__note">選んだ商品を予約フォームに引き継げます（LINEでのご予約）。LINEをお持ちでない方は、この仕様をお電話（<a href="tel:07091580641">070-9158-0641</a>）でお伝えください。</p>';
    document.getElementById('pdReserveSlot').appendChild(box);
    box.querySelector('button').addEventListener('click', function(){
      const sizeMatch = String(item.desc || '').match(/^【([^】]+)】/);
      window.KoimariDraft.start({
        name: plainName, productType: productType, idx: productIdx,
        img: item.img, price: item.price || '', size: sizeMatch ? sizeMatch[1] : '',
        spec: window.KoimariDraft.buildSpec(item.spec),
        orderMode: window.KoimariPriceHint ? window.KoimariPriceHint.orderModeOf(item) : '',
        no: productType === 'decorationCake' ? Number(item.no) || 0 : 0
      }, this);
    });
  }
  setupSticky(item);
  renderRelated(list, config);
}

const TYPE_LABELS = { decorationCake: 'デコレーションケーキ', cutcake: 'カットケーキ', rollcake: 'ロールケーキ', baked: '焼き菓子', gift: 'ギフト', category: '商品・ケーキ', recommended: 'おすすめ' };
function priceHintFor(it, type) {
  if (!window.KoimariPriceHint) return Promise.resolve('');
  return window.KoimariPriceHint.load().then(pr => window.KoimariPriceHint.priceText(it, type, pr)).catch(() => '');
}
function renderMedia(photos, plainName, gated) {
  const wrap = document.getElementById('productPhotos');
  const slides = gated ? photos.slice(0, 1) : photos;
  if (!slides.length) { wrap.innerHTML = ''; return; }
  let html = '<div class="pd-slider" id="pdSlider">' + slides.map((src, i) => '<div class="pd-slide" data-i="' + i + '"><img src="' + esc(src) + '" alt="' + esc(plainName) + '"' + (i ? ' loading="lazy"' : '') + '></div>').join('') + '</div>';
  if (slides.length > 1) {
    html += '<div class="pd-dots">' + slides.map((_, i) => '<button type="button" aria-label="' + (i + 1) + '枚目の写真" data-i="' + i + '"' + (i ? '' : ' class="is-active"') + '></button>').join('') + '</div>';
    html += '<div class="pd-thumbs">' + slides.map((src, i) => '<button type="button" data-i="' + i + '"' + (i ? '' : ' class="is-active"') + '><img src="' + esc(src) + '" alt="" loading="lazy"></button>').join('') + '</div>';
  }
  wrap.innerHTML = html;
  const slider = document.getElementById('pdSlider');
  const mark = (i) => wrap.querySelectorAll('.pd-dots button, .pd-thumbs button').forEach(b => b.classList.toggle('is-active', Number(b.dataset.i) === i));
  slider.addEventListener('scroll', () => { mark(Math.round(slider.scrollLeft / Math.max(1, slider.clientWidth))); }, { passive: true });
  wrap.querySelectorAll('.pd-dots button, .pd-thumbs button').forEach(b => b.addEventListener('click', () => { slider.scrollTo({ left: Number(b.dataset.i) * slider.clientWidth, behavior: 'smooth' }); mark(Number(b.dataset.i)); }));
  slider.querySelectorAll('.pd-slide').forEach(sl => sl.addEventListener('click', () => openLightbox(slides[Number(sl.dataset.i)], plainName)));
}
function renderInfo(item, plainName, config) {
  const label = TYPE_LABELS[productType] || '';
  const crumbCat = document.getElementById('pdCrumbCat');
  crumbCat.textContent = label || 'ギャラリー'; crumbCat.href = config.back;
  document.getElementById('pdCrumbName').textContent = plainName;
  const badges = [];
  const isCustom = productType === 'decorationCake' && window.KoimariPriceHint && window.KoimariPriceHint.orderModeOf(item) === 'custom';
  if (productType === 'decorationCake') badges.push(isCustom ? '<span class="pd-badge pd-badge--custom">フルオーダー</span>' : '<span class="pd-badge">定番</span>');
  if (item.featured) badges.push('<span class="pd-badge pd-badge--popular">人気</span>');
  if (item.seasonal) badges.push('<span class="pd-badge pd-badge--seasonal">季節限定</span>');
  document.getElementById('pdBadges').innerHTML = badges.join('');
  // デコレーションケーキの固定番号（お電話でのお問い合わせ用。2026-10-02）
  const no = productType === 'decorationCake' && Number(item.no) > 0 ? 'No.D' + String(item.no).padStart(2, '0') : '';
  if (no) document.getElementById('pdBadges').insertAdjacentHTML('beforeend', '<span class="pd-no">' + no + '</span>');
  const PH = window.KoimariPriceHint;
  const size = PH ? PH.sizeOf(item) : '';
  document.getElementById('pdChips').innerHTML = size ? '<span class="pd-chip">写真のサイズ：' + esc(PH.sizeLabel(size)) + '</span>' : '';
  const priceEl = document.getElementById('pdPrice');
  priceEl.innerHTML = '';
  if (isCustom) priceEl.innerHTML = '<span class="pd-price__custom">お見積もり制</span><span class="pd-price__note">写真のケーキをもとに、パティシエがお見積もり・納期をご回答します</span>';
  priceHintFor(item, productType).then(t => {
    if (!t) return;
    const isHint = !item.price;
    priceEl.innerHTML = esc(t) + '<small>（税込）</small>' + (isHint ? '<span class="pd-price__note">' + (size ? esc(size) + 'の場合のお値段です。' : '') + 'サイズ・クリーム・飾りの変更でお値段が変わります</span>' : '');
    const sp = document.getElementById('pdStickyPrice'); if (sp) sp.textContent = t;
  });
  const text = plainName + ' ' + String(item.desc || '');
  const pts = [];
  if (/フルーツ|いちご|苺|果実|ベリー|タルト/.test(text)) pts.push('季節のフルーツをたっぷり。見た目も味も華やかに仕上げます');
  if (productType !== 'category' && productType !== 'recommended') pts.push('お店で一つひとつ手作りしています');
  pts.push('お酒はごく少量で、焼き上げの時にしっかり加熱して飛ばしています。小さなお子様にも安心です');
  document.getElementById('pdPoints').innerHTML = '<li class="pd-points__head">こいまりのこだわり</li>' + pts.map(t => '<li>' + esc(t) + '</li>').join('');
}
function setupSticky(item) {
  const bar = document.getElementById('pdSticky');
  const main = document.querySelector('#productReserve button');
  if (!bar || !main) { if (bar) bar.style.display = 'none'; document.body.classList.remove('has-sticky'); return; }
  bar.style.display = 'flex';
  document.body.classList.add('has-sticky');
  const btn = document.getElementById('pdStickyBtn');
  if (!btn.dataset.bound) { btn.dataset.bound = '1'; btn.addEventListener('click', () => { const b = document.querySelector('#productReserve button'); if (b) b.click(); }); }
}
function renderRelated(list, config) {
  const wrap = document.getElementById('pdRelatedWrap');
  const row = document.getElementById('pdRelated');
  if (!wrap || !row || productType === 'category' || productType === 'recommended' || !Array.isArray(list)) { if (wrap) wrap.style.display = 'none'; return; }
  const items = list.map((it, idx) => ({ it, idx })).filter(o => o.it && o.it.img && o.it.visible !== false && o.idx !== productIdx).slice(0, 10);
  if (!items.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  row.innerHTML = items.map(o => '<a class="pd-rel" href="product.html?type=' + productType + '&idx=' + o.idx + '"><img src="' + esc(o.it.img) + '" alt="" loading="lazy"><div class="pd-rel__body"><div class="pd-rel__name">' + esc(String(o.it.name || '').replace(/<[^>]*>/g, ' ')) + '</div><div class="pd-rel__price" data-rel="' + o.idx + '"></div></div></a>').join('');
  items.forEach(o => priceHintFor(o.it, productType).then(t => { const el = row.querySelector('[data-rel="' + o.idx + '"]'); if (el && t) el.textContent = t; }));
}
window.renderProductPage = renderProductPage;
renderProductPage();
</script>

<script type="module">
// 2026-09-08判明：Firebase JS SDKのリアルタイム購読(onValue)や、"siteImages"全体を
// 一括取得するREST呼び出しは、実写真base64を多数含む大容量ノード（カットケーキ等）
// を読む際に一部の子ノードが欠落して届くことがあり、商品詳細ページが誤って
// 「見つかりませんでした」と表示される不具合があった。このページで実際に必要なのは
// 該当カテゴリ1つ分のデータだけのため、"siteImages"全体ではなく該当パス
// （例：siteImages/cutcakes.json）だけをfetch()で取得することで、ペイロードを
// 小さく保ちつつ確実に取得できるようにした。
const DATABASE_URL = "https://koimari-tasting-default-rtdb.asia-southeast1.firebasedatabase.app";

function applySiteImagesData(key, list){
  if (!Array.isArray(list)) return;
  try {
    const cur = JSON.parse(localStorage.getItem("koimari_images") || "{}");
    cur[key] = list;
    localStorage.setItem("koimari_images", JSON.stringify(cur));
  } catch(e) {}
}

async function fetchList(key){
  const res = await fetch(DATABASE_URL + "/siteImages/" + key + ".json");
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

(async () => {
  const config = TYPE_CONFIG[productType];
  for (let attempt = 0; attempt < 2; attempt++) {
    if (attempt > 0) await new Promise(r => setTimeout(r, 400));
    try {
      const list = await fetchList(config.key);
      window.firebaseSynced = true;
      applySiteImagesData(config.key, list);
      if (typeof window.renderProductPage === "function") window.renderProductPage();
      if (Array.isArray(list) && list[productIdx]) break; // 見つかったので終了
    } catch (e) {
      window.firebaseSynced = true;
      if (typeof window.renderProductPage === "function") window.renderProductPage();
    }
  }
})();
</script>
