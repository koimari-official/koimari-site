name: build-static
# 公開データ（商品・作例）から catalog.html / llms.txt / メニュー構造化データを自動更新する。価格は載せない。
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-static
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-static.mjs
      - name: 差分があるときだけコミット
        run: |
          if [ -n "$(git status --porcelain catalog.html llms.txt index.html sitemap.xml)" ]; then
            git config user.name "koimari-bot"
            git config user.email "actions@users.noreply.github.com"
            git add catalog.html llms.txt index.html sitemap.xml
            git commit -m "auto: 商品一覧・構造化データを更新"
            git push
          fi
