<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:2500px;height:1686px;font-family:"M PLUS Rounded 1c",sans-serif;overflow:hidden;background:#e9e2d6;}
  .grid{display:grid;grid-template-columns:833px 834px 833px;grid-template-rows:843px 843px;width:2500px;height:1686px;gap:6px;background:#e9e2d6;}
  .cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;}

  .hero{background:radial-gradient(circle at 50% 38%,#fbe9c8 0%,#f0cf94 45%,#d9a25c 100%);}
  .hero__bg{position:relative;z-index:1;width:104%;margin:0 auto -8px;object-fit:contain;filter:drop-shadow(0 18px 20px rgba(90,50,20,.35));}
  .hero__scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(46,33,24,0) 0%,rgba(46,33,24,.06) 60%,rgba(38,24,16,.5) 100%);}
  .hero__jp{position:relative;z-index:2;font-size:86px;font-weight:900;letter-spacing:.02em;color:#4a2f1c;text-shadow:0 2px 0 rgba(255,255,255,.5);line-height:1.15;}
  .tile{background:#e8c98f url(whitechoco_block.png) center/100% 100% no-repeat;}
  .tile--dark{background:#4a2f1c url(itachoco_block.png) center/100% 100% no-repeat;}
  .tile--dark::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(120,80,45,.38) 0%,rgba(40,22,12,.62) 100%);z-index:0;}
  .tile .jp,.tile--dark .jp{position:relative;z-index:1;font-size:94px;font-weight:900;letter-spacing:.01em;line-height:1.1;margin-top:14px;}
  .tile--dark .jp{color:#fff;}
  .tile .jp{color:#5a3d1e;}
  .glow{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);width:520px;height:520px;border-radius:50%;z-index:0;}
  .tile--dark .glow{background:radial-gradient(circle,rgba(255,230,180,.28) 0%,rgba(255,230,180,0) 70%);}
  .tile:not(.tile--dark) .glow{background:radial-gradient(circle,rgba(255,255,255,.45) 0%,rgba(255,255,255,0) 70%);}
  .icon-slot{position:relative;z-index:1;height:470px;display:flex;align-items:center;justify-content:center;}
  .sil{width:470px;height:470px;}
  .sil svg{width:100%;height:100%;}
  .logo-mark{width:520px;height:520px;object-fit:contain;}
  .qmark{font-size:340px;font-weight:900;line-height:1;color:#fff;}
</style>
</head>
<body>
  <div class="grid">

    <div class="cell hero">
      <div class="hero__scrim"></div>
      <img class="hero__bg" src="tanukichi_cutout.png">
      <div class="hero__jp">季節限定メニュー</div>
    </div>

    <div class="cell tile--dark">
      <div class="glow"></div>
      <div class="icon-slot"><div class="sil">__ICON_CAKE__</div></div>
      <div class="jp">ご予約</div>
    </div>

    <div class="cell tile">
      <div class="glow"></div>
      <div class="icon-slot"><div class="sil">__ICON_CHEKI__</div></div>
      <div class="jp">ギャラリー</div>
    </div>

    <div class="cell tile--dark">
      <div class="glow"></div>
      <div class="icon-slot"><div class="sil">__ICON_TICKET__</div></div>
      <div class="jp">クーポン</div>
    </div>

    <div class="cell tile">
      <div class="glow"></div>
      <div class="icon-slot"><img class="logo-mark" src="koimari-logo.png"></div>
      <div class="jp">店舗情報</div>
    </div>

    <div class="cell tile--dark">
      <div class="glow"></div>
      <div class="icon-slot"><div class="qmark">?</div></div>
      <div class="jp">よくある質問</div>
    </div>

  </div>
</body></html>
